name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generar estructura Android
        run: flutter create --platforms=android .

      - name: Cambiar nombre de la App a Gastos Ruth
        run: |
          sed -i 's/android:label=".*"/android:label="Gastos Ruth"/g' android/app/src/main/AndroidManifest.xml

      - name: Generar Icono de Gato
        run: |
          cat << 'EOF' > android/app/src/main/res/drawable/cat_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#009688"
                  android:pathData="0,0h108v108h-108z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,28c-14.36,0 -26,11.64 -26,26 0,8.74 4.31,16.48 10.92,21.18L35,84l13.11,-4.37c1.88,0.25 3.82,0.37 5.89,0.37 2.07,0 4.01,-0.12 5.89,-0.37L73,84l-3.92,-8.82C75.69,70.48 80,62.74 80,54c0,-14.36 -11.64,-26 -26,-26zM35,38l9,10 -11,5 2,-15zM73,38l2,15 -11,-5 9,-10zM42,56c2.21,0 4,1.79 4,4s-1.79,4 -4,4 -4,-1.79 -4,-4 1.79,-4 4,-4zM66,56c2.21,0 4,1.79 4,4s-1.79,4 -4,4 -4,-1.79 -4,-4 1.79,-4 4,-4zM54,68c3.5,0 6.5,-1.5 8,-3.5H46c1.5,2 4.5,3.5 8,3.5z"/>
          </vector>
          EOF
          sed -i 's/android:icon=".*"/android:icon="@drawable\/cat_icon"/g' android/app/src/main/AndroidManifest.xml

      - name: Obtener dependencias
        run: flutter pub get

      - name: Generar íconos de la app
        run: flutter pub run flutter_launcher_icons
        
      - name: Compilar APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Subir archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: app-gastos-ruth-release
          path: build/app/outputs/flutter-apk/app-release.apk
